name: Mod AIO Audio

on:
  push:
    # Path filters do not apply to tag pushes: a tag aio-audio-v* always builds and publishes a release.
    branches: ["**"]
    tags: ["aio-audio-v*"]
    paths: ["mods/aio-audio/**", ".github/workflows/mod-aio-audio.yml"]
  pull_request:
    paths: ["mods/aio-audio/**", ".github/workflows/mod-aio-audio.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NICKELTC: ghcr.io/pgaskin/nickeltc:1.0
  NICKELHOOK_COMMIT: bcd90ba94d90d22562fb64ef2920ed3323c1dae5

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: NickelHook (pinned)
        working-directory: mods/aio-audio
        run: |
          git clone --quiet https://github.com/pgaskin/NickelHook NickelHook
          git -C NickelHook -c advice.detachedHead=false checkout "$NICKELHOOK_COMMIT"
      - name: Build with NickelTC
        run: |
          docker pull --quiet "$NICKELTC"
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/mods/aio-audio:/src" -w /src "$NICKELTC" \
            sh -c 'make all koboroot && arm-nickel-linux-gnueabihf-readelf -d src/libaioaudio.so > readelf.txt &&
                   arm-nickel-linux-gnueabihf-nm -D --defined-only src/libaioaudio.so > exports.txt'
      - name: Check exports and package
        working-directory: mods/aio-audio
        run: |
          grep -E "NEEDED|RPATH|RUNPATH" readelf.txt
          for s in NickelHook _aio_reader _aio_setText _aio_setPixmap _aio_setGeometry _aio_setMedia; do
            grep -qw "$s" exports.txt || { echo "missing export $s"; exit 1; }
          done
          tar tzvf KoboRoot.tgz
          sha256sum KoboRoot.tgz src/libaioaudio.so | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aio-audio
          path: |
            mods/aio-audio/KoboRoot.tgz
            mods/aio-audio/src/libaioaudio.so
            mods/aio-audio/SHA256SUMS
            mods/aio-audio/readelf.txt

  release:
    # Only for tags aio-audio-v*; the only job allowed to write (create/update the release).
    if: startsWith(github.ref, 'refs/tags/aio-audio-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aio-audio
          path: dist
      - name: Check package
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          test "$(tar tzf KoboRoot.tgz | grep -v '/$' | sed 's#^\./##' | sort | tr '\n' ' ')" = \
            "mnt/onboard/.adds/aio-audio/LEEME.txt usr/local/Kobo/imageformats/libaioaudio.so "
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          # Prerelease and never "latest": the app releases (v*) keep the latest slot.
          # A release that already has a KoboRoot.tgz is never overwritten: Kobo AIO pins that exact file
          # (the one tested on a device), and a rebuild is not byte-identical (tar timestamps).
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx KoboRoot.tgz; then
            echo "release $TAG already has KoboRoot.tgz: kept as is"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" KoboRoot.tgz SHA256SUMS
          else
            gh release create "$TAG" KoboRoot.tgz SHA256SUMS --verify-tag --prerelease --latest=false \
              --title "AIO Audio ${TAG#aio-audio-v} (experimental)" \
              --notes "Mod experimental AIO Audio para Nickel (firmware 4.23 a 4.x). Kobo AIO lo instala y verifica por SHA-256; para fijar este build usa: make pin-aioaudio TGZ=KoboRoot.tgz VERSION=${TAG#aio-audio-v}"
          fi
