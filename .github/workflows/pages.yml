name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", "tools/kobo_aio/**", "tools/build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned downloads (Pyodide + mods) are re-verified by SHA-256 on every build; the cache only saves bandwidth.
      - uses: actions/cache@v4
        with:
          path: ~/Kobo-AIO/cache
          key: site-${{ hashFiles('tools/build_site.py', 'tools/kobo_aio/modules/*.py') }}
          restore-keys: site-
      - run: python -m pip install Pillow   # the engine imports it while listing the pinned artifacts
      - run: python tools/build_site.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
