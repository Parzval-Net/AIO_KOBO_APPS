name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  aio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python -m unittest discover -s tests -p 'test_kobo_aio.py' -v
  inkboy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make test HOST_CC=gcc HOST_CXX=g++
