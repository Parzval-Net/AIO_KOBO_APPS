# Ink-boy for Kobo Configuration
# Auto-configured by the Kobo Ink-boy Installer for Kobo Libra Colour & Clara HD

[display]
# 6 = 960x864 (even multiple aligned with Kaleido 3 2x2 CFA grid to prevent color moire)
# 7 = 1120x1008 (maximum integer scale on Kobo Libra Colour)
scale = 6

# quality = Kaleido 3 Color (GLRC16) on Libra Colour / 4-Gray (DU4) on Clara HD
# turbo   = Ultra-fast 1-bit Ordered Bayer 2x2 (WFM_A2 / WFM_DU) on both devices
mode = quality

# Default DMG palette when playing monochrome .gb games on Kobo Libra Colour:
# 0 = Grayscale, 1 = PokeRedBlue, 2 = OriginalGreen, 3 = GbcGoldCyan
dmg_palette = 1

[input]
# Physical page-turn button mapping on Kobo Libra Colour:
# A_B = Top button is A, Bottom button is B
# B_A = Top button is B, Bottom button is A
# START_SELECT = Top is Start, Bottom is Select
libra_buttons = A_B

[system]
# What happens when you exit Ink-boy:
#   resume = return to Nickel (default)
#   reboot = clean reboot (use it if returning to Nickel freezes on your firmware)
exit_mode = resume
# Experimental: also pause Nickel's watchdog (sickel) while playing. yes / no
pause_watchdog = no
